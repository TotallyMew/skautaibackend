stages:
  - build
  - test

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

build:
  stage: build
  script:
    - $env:GRADLE_USER_HOME = "$(Get-Location)/.gradle"
    - ./gradlew build -x test
  cache:
    key: "$CI_COMMIT_REF_NAME"
    paths:
      - .gradle/

test:
  stage: test
  script:
    - $env:GRADLE_USER_HOME = "$(Get-Location)/.gradle"
    - $env:TEST_DB_URL = "jdbc:postgresql://localhost:5432/skautu_inventorius_test"
    - $env:TEST_DB_USER = "postgres"
    - $env:TEST_DB_PASSWORD = "$env:TEST_DB_PASSWORD"
    - $env:TEST_JWT_SECRET = "$env:TEST_JWT_SECRET"
    - ./gradlew test
  cache:
    key: "$CI_COMMIT_REF_NAME"
    paths:
      - .gradle/